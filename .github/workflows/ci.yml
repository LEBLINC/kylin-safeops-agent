name: CI

# CI runs on ubuntu-latest (x86). LoongArch + Kylin V11 real verification
# is done manually on VM. See README for details.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache pre-commit hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py3.11-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-py3.11-
      - name: Install backend deps (runtime + dev tools)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -c backend/constraints.txt
          pip install -r backend/requirements-dev.txt -c backend/constraints.txt
      # ruff(lint+format) + mypy + pytest all run via pinned pre-commit hooks.
      # pytest runs as a local system hook using the env above (requirements-dev.txt).
      # backend/constraints.txt pins transitive deps to prevent drift.
      - name: Lint + type-check + test (via pinned pre-commit hooks)
        run: pre-commit run --all-files --show-diff-on-failure

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
