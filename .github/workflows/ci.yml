name: CI

# 仅 x86（ubuntu）。LoongArch + 麒麟 V11 兼容性以真机另验，CI 不覆盖（见 README / 手册 §2.3）。
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # 对齐麒麟 V11 靶机实测 Python 3.11.6（CI 须与生产环境同版本，否则绿了也不代表靶机能跑）
          cache: pip               # 任务C：缓存 pip 下载，加速依赖安装（纯加速，不改校验语义）
      - name: Cache pre-commit hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py3.11-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-py3.11-
      - name: Install backend deps (runtime + dev tools)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -c backend/constraints.txt
          pip install -r backend/requirements-dev.txt -c backend/constraints.txt
      # 单一来源防漂移（复审重点②）：ruff/mypy 版本由 .pre-commit-config.yaml 的 pinned rev 决定，
      # 与本地 pre-commit 完全一致。本步涵盖：
      #   ruff(lint+format) · mypy(仅 contracts，启 pydantic.mypy) · pytest(必须收集到用例且全过)
      # 注：pytest 经 pre-commit 的 local system hook 在本 env 调用，故须由 requirements-dev.txt 装入。
      # 传递依赖由 backend/constraints.txt 封顶（L-8），杜绝浮动漂移。
      - name: Lint + type-check + test (via pinned pre-commit hooks)
        run: pre-commit run --all-files --show-diff-on-failure

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend   # 所有 run 步骤在 frontend/ 内执行；
                                       # 修复：原 `npx --prefix frontend vue-tsc` 中 npx 不认 --prefix，
                                       # 会把坏参数喂给 vue-tsc → 打印 tsc 帮助并 exit 1（CI #36 frontend-build 红）。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json   # uses 步骤，路径相对仓库根
      - name: Install frontend deps
        run: npm ci
      - name: Type-check
        run: npx vue-tsc --noEmit
      - name: Build
        run: npm run build
