# 工具配置统一落点（手册 §2.1 未列，但为标准位置；本文件冻结"仓库根 = 导入根"）。
# 不声明构建后端 / 包元数据：本仓为应用 monorepo，依赖走 backend/requirements.txt。

[tool.pytest.ini_options]
pythonpath = ["."]              # 冻结 仓库根=导入根：backend.app.* 与 mcp_servers.os_ops 一致可导
testpaths = ["backend/tests", "mcp_servers/rca/tests", "deploy/sso/tests", "deploy/proxy/tests"]
# "协程建了从没跑"必须当次红，不能只是一条警告。
# 它的含义是"你以为在跑的一段代码，一行都没跑"——断言在不在都一样绿。
# 本仓已被这一类咬过两次：P1-2 的 pytest.mark.asyncio 未注册、
# test_get_llm_record_mode.py 裸调 async _drive()（那条标着 "X P5 fix violation"
# 的断言从未执行过）。
#
# 两条**缺一不可**（探针实测，删掉任一条都会静默退回"绿 + 一条警告"）：
#   第 1 条把 RuntimeWarning 升成异常。但 never-awaited 是 GC 时经
#     sys.unraisablehook 抛的、不在用例栈上，pytest 只能把它再包一层
#     成 PytestUnraisableExceptionWarning —— 只有这条时用例照旧 pass。
#   第 2 条把那个包装类升红。但只有这条时第 1 步不升级，压根不产生
#     unraisable，包装警告也不出现 —— 同样照旧 pass。
# 不整体 -W error（避免第三方 DeprecationWarning 把 CI 变成噪声闸）。
# 第 2 条顺带覆盖 __del__ 里静默失败的清理逻辑，同属"你以为跑了其实没跑"。
filterwarnings = [
    "error:coroutine .* was never awaited:RuntimeWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.mypy]
python_version = "3.10"         # 下限 3.10（契约用 PEP 604）；麒麟 V11 靶机实测 Python 3.11.6，按 3.10 写下限兼容
plugins = ["pydantic.mypy"]     # 否则 D2 contracts 的 pydantic v2 模型会误报 / 漏校
files = ["backend/app", "deploy/sso", "deploy/proxy"]
exclude = ["deploy/sso/tests", "deploy/proxy/tests"]  # B5 commit 1 + deploy tests 目录不进 mypy
explicit_package_bases = true   # 多个 deploy 目录同名 module 冲突解决（B5 commit 1）

# C3（阶段6 第二梯队）：deploy/proxy 经 deploy.sso.ldap_client 传递 import ldap3；
# ldap3 无类型 stub（types-ldap3 未装，LoongArch 离线部署不引入新依赖）。
# 该库本身缺 stub（非本仓代码问题），用 per-module override 精准消音，
# 不碰 deploy/sso/ldap_client.py（属其他模块，C3 边界不可越）。
[[tool.mypy.overrides]]
module = "ldap3"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["third_party", "_reference"]   # vendored fork / 仅参考代码，不进 lint 闸
force-exclude = true                              # 关键：pre-commit 显式传文件名时也强制排除


[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 依赖注入靠"在参数默认值里调用 Depends/Header/... "实现，是官方惯用法；
# 把这些可调用项加入白名单，避免 B008 误报，同时保留 B008 抓真正的可变默认值 bug。
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]
