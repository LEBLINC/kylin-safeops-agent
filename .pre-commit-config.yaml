# ruff(lint+format) 全量；mypy 仅 contracts（启 pydantic.mypy 插件）；pytest 必须收集到用例并全过
# （L-5：去除 exit5 容忍——收集为 0 视为失败，防 collection 配错导致四道闸假绿）。
# 版本与 backend/requirements.txt 的 ruff/mypy pin 对齐（复审重点②，防 CI 漂移）。
minimum_pre_commit_version: "3.5.0"
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^(third_party|_reference)/   # vendored fork / 仅参考代码，不进 lint 闸
      - id: ruff-format
        exclude: ^(third_party|_reference)/
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        # 任务C + GAP-5：mypy 强制范围从仅 contracts 扩到 L 核心目录（agent/mcp/llm/api）
        # 及 L 自有的 mcp_servers/os_ops（11+ 工具/解析器/dispatch）；与 pyproject 对齐。
        # **不含 D 的 security/executor/audit**（C3 边界）。
        files: ^(backend/app/(contracts|agent|mcp|llm|api)|mcp_servers/os_ops)/
        # 隔离环境需装运行时依赖供 mypy 解析类型（fastapi/httpx 自带 py.typed）；
        # 版本与 backend/requirements.txt pin 同步（L-5 防漂移）。
        additional_dependencies:
          - pydantic==2.13.4
          - fastapi==0.136.3
          - httpx==0.28.1
  - repo: local
    hooks:
      - id: pytest
        name: pytest (must collect & pass; exit 5 = 收集为 0 视为失败)
        entry: python -c 'import subprocess,sys; sys.exit(0 if subprocess.run([sys.executable,"-m","pytest","-q"]).returncode == 0 else 1)'
        language: system
        pass_filenames: false
        always_run: true
