# ruff(lint+format) 全量；mypy 仅 contracts（启 pydantic.mypy 插件）；pytest 容忍"无测试"(exit 5)
# 版本与 backend/requirements.txt 的 ruff/mypy pin 对齐（复审重点②，防 CI 漂移）。
minimum_pre_commit_version: "3.5.0"
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^(third_party|_reference)/   # vendored fork / 仅参考代码，不进 lint 闸
      - id: ruff-format
        exclude: ^(third_party|_reference)/
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: ^backend/app/contracts/          # 仅 contracts 强制类型
        additional_dependencies: [pydantic>=2]  # 供 pydantic.mypy 插件加载（见 pyproject [tool.mypy]）
  - repo: local
    hooks:
      - id: pytest
        name: pytest (tolerate no-tests = exit 5)
        entry: python -c 'import subprocess,sys; sys.exit(0 if subprocess.run([sys.executable,"-m","pytest","-q"]).returncode in (0,5) else 1)'
        language: system
        pass_filenames: false
        always_run: true
