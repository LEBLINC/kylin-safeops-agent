# Kylin SafeOps Agent — P1b 真 LDAP 端到端实证用 slapd 配置
# 范围：仅用于麒麟 V11 + LoongArch VM 实证；非生产配置。
# 部署见同目录 README.md。
#
# 设计要点：
# - dc=kylin,dc=test 沙箱根
# - mdb 后端（OpenLDAP 2.4+ 推荐）
# - memberOf overlay 开启：让 ldap3 客户端 search 时直接拿 group 成员
# - 全 cn 小写，规避大小写敏感（与 LdapClient._normalize_group_name 大小写策略保持一致）
# - rootpw 留占位符 __ROOTPW_SSHA__，由 VM runbook 用 slappasswd 现场生成后 sed 替换；
#   严禁将真实 hash commit 进仓库（S9 铁律）。

#--- 基础 schema ---
include         /etc/openldap/schema/core.schema
include         /etc/openldap/schema/cosine.schema
include         /etc/openldap/schema/inetorgperson.schema
include         /etc/openldap/schema/nis.schema

#--- 运行时文件 ---
pidfile         /var/run/openldap/slapd.pid
argsfile        /var/run/openldap/slapd.args

#--- 模块（仅 memberof overlay；back_mdb 在 OpenLDAP 2.6+ 已静态编译进 slapd，不需要 moduleload）---
modulepath      /usr/lib64/openldap
moduleload      memberof.la

#--- 数据库 ---
database        mdb
maxsize         1073741824
suffix          "dc=kylin,dc=test"
rootdn          "cn=admin,dc=kylin,dc=test"

# rootpw：由 runbook 现场用 `slappasswd -s "$KYLIN_LDAP_ROOTPW"` 生成 SSHA，sed 替换占位符。
# 占位符故意写成非法 hash 形式，未替换时 slapd 启动失败 → 防止误把空 rootpw 推上线。
rootpw          __ROOTPW_SSHA__

directory       /var/lib/ldap

#--- 索引 ---
index   objectClass     eq,pres
index   ou,cn,mail,surname,givenname    eq,pres,sub
index   uid             eq,pres,sub
index   memberOf        eq

#--- memberOf overlay：让用户对象自动反向带 memberOf 属性 ---
overlay         memberof
memberof-group-oc       groupOfNames
memberof-member-ad      member
memberof-memberof-ad    memberOf
memberof-refint         TRUE

#--- 访问控制（沙箱实证用，非生产）---
# - 任何用户可读自己（含 memberOf）
# - admin 可读写全树
# - 匿名禁查
access to attrs=userPassword
        by self write
        by anonymous auth
        by * none

access to *
        by self read
        by dn.exact="cn=admin,dc=kylin,dc=test" write
        by users read
        by * none
