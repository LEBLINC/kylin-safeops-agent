# Kylin SafeOps Agent — Nginx 反向代理配置示例
# 部署时替换 YOUR_DOMAIN 为实际域名或 IP，替换 /etc/nginx/ssl/kylin.{crt,key} 为真实证书路径。
#
# B1b（架构审计 154f767 §2）：本文件是拓扑的"前门"——之前直连 127.0.0.1:8000（app），
# 完全绕过 deploy/proxy/proxy.py 反代 sidecar（真 LDAP 鉴权 + HMAC v2 签名注入），
# 等同于生产裸奔无认证。现改为 nginx(443,TLS) → proxy sidecar(127.0.0.1:8080) →
# app(127.0.0.1:8000)，且 app 只监听 127.0.0.1（见 app/kylin-safeops-agent.service），
# 物理上无法被外部直连绕过 sidecar。
#
# 限流：本文件是 server{} 片段（放入 http{} 上下文，如 /etc/nginx/sites-available/）。
# limit_req_zone 指令只能在 http{} 作用域声明，需在主 nginx.conf 的 http{} 块内加一行：
#   limit_req_zone $binary_remote_addr zone=kylin_api:10m rate=20r/s;
# 本文件的 location /api/ 引用该 zone（limit_req）。
#
# 同样需在主配置 http{} 块内加一行（麒麟 V11 + LoongArch 实机验证发现）：
#   server_names_hash_bucket_size 64;
# 该值部分平台默认 32，server_name 稍长即触发启动失败
# （nginx -t 报 "could not build server_names_hash, you should increase
# server_names_hash_bucket_size: 32"）。实机上 kylin-safeops.test 这个长度就已命中，
# 生产域名普遍更长，大概率同样命中——故不是可选调优项，而是部署必做项。
# 部署核对：nginx -t 报错时按此加行后重跑，见部署核对清单 D-2。

# HTTP → HTTPS 强制跳转（不在 80 端口处理业务，只重定向）
server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    # 麒麟 V11 随附 nginx 1.24，只认 `listen ... http2` 合并语法；独立指令 `http2 on;`
    # 是 1.25.1+ 才引入的，1.24 上会直接 "unknown directive" 启动失败。
    # 合并语法在 1.25.1+ 仅产生弃用告警，不影响启动——故统一用合并语法向下兼容。
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/nginx/ssl/kylin.crt;
    ssl_certificate_key /etc/nginx/ssl/kylin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 安全响应头（HSTS 只在 HTTPS 生效；其余防点击劫持/MIME 嗅探/内容注入）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    # 前端静态文件
    root /var/www/kylin-safeops;
    index index.html;

    # API 反代到 proxy sidecar（8080，非 app 的 8000）——sidecar 完成真 LDAP 鉴权 +
    # HMAC v2 签名注入后才转发给 app；app 只信任 sidecar 注入的签名头。
    location /api/ {
        limit_req zone=kylin_api burst=20 nodelay;

        # 剥离客户端可能伪造的签名/角色头（防伪造绕过；proxy.py 侧 STRIP_HEADERS
        # 已做同样剥离，这里是纵深防御——即便 sidecar 逻辑被绕过一层也不放过伪造头）。
        proxy_set_header X-Auth-User "";
        proxy_set_header X-Auth-Roles "";
        proxy_set_header X-Auth-Timestamp "";
        proxy_set_header X-Auth-Signature "";
        proxy_set_header X-Auth-Method "";
        proxy_set_header X-Auth-Path "";
        proxy_set_header X-Auth-Body-Sha "";
        proxy_set_header X-Auth-Nonce "";
        proxy_set_header X-User-Role "";

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # SSE 事件流（关闭缓冲以保持实时推送；同样剥离伪造签名头 + 走 sidecar:8080）
    location /api/chat/ {
        limit_req zone=kylin_api burst=20 nodelay;

        proxy_set_header X-Auth-User "";
        proxy_set_header X-Auth-Roles "";
        proxy_set_header X-Auth-Timestamp "";
        proxy_set_header X-Auth-Signature "";
        proxy_set_header X-Auth-Method "";
        proxy_set_header X-Auth-Path "";
        proxy_set_header X-Auth-Body-Sha "";
        proxy_set_header X-Auth-Nonce "";
        proxy_set_header X-User-Role "";

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
