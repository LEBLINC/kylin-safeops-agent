# Kylin SafeOps Agent — Nginx 主配置片段（http{} 作用域）
#
# 用法（二选一）：
#   a) 复制本文件到 /etc/nginx/conf.d/kylin-http.conf（该目录默认被主配置 include 进 http{}）
#   b) 或把下面两行直接粘进 /etc/nginx/nginx.conf 的 http { ... } 块内
#
# 这两条**必须**在 http{} 作用域，deploy/nginx.conf 那个 server{} 片段无法自带：
#
# 1) limit_req_zone —— deploy/nginx.conf 的 location /api/ 与 /api/chat/ 都写了
#    `limit_req zone=kylin_api ...`。zone 未声明时 nginx -t 直接报
#    `unknown limit_req_zone "kylin_api"` 并拒绝启动 —— 结果是前端与 API 全不可达。
#
# 2) server_names_hash_bucket_size —— 该值部分平台默认 32，server_name 稍长即触发
#    `could not build server_names_hash, you should increase
#     server_names_hash_bucket_size: 32` 启动失败。生产域名普遍较长，故按 64 预置。
#
# 部署核对：加完后跑 `nginx -t`，预期输出 `syntax is ok` + `test is successful`。
# 不符排查：仍报 unknown zone → 确认本片段确实被 include 进了 http{} 而非 server{}；
#          仍报 server_names_hash → 按报错提示继续翻倍（128）。

limit_req_zone $binary_remote_addr zone=kylin_api:10m rate=20r/s;
server_names_hash_bucket_size 64;
